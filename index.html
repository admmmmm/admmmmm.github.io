<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我们的团队主页</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <nav class="nav">
            <h1 class="logo">北邮无人机机器人队一队</h1> <ul class="nav-links">
                <li><a href="#about">关于我们</a></li>
                <li><a href="#members">团队成员</a></li>
                <li><a href="#projects">项目作品</a></li>
            </ul>
        </nav>
    </header>

    <section id="about" class="section about-section">
        <div class="container">
            <h2>关于我们</h2>
            <p>我们是一个由三名热情的创造者组成的团队。</p>
            <p>我们的团队口号是：“AI赋能，创意无限”。</p> <p>我们相信技术的力量，并致力于用创新的方法解决现实问题。</p> </div>
    </section>

<section id="members" class="section members-section">
        <div class="container">
            <h2>团队成员</h2>
            <div class="members-interactive-wrapper" id="members-interactive-wrapper">
                <div class="members-column left-column" id="left-column">
                    </div>
                <div class="member-detail-display" id="detail-display">
                    <h3>请将鼠标悬停在队员头像上</h3>
                    <p>来查看他们的信息。</p>
                </div>
                <div class="members-column right-column" id="right-column">
                    </div>
            </div>
        </div>
    </section>

    <section id="projects" class="section projects-section">
        <div class="container">
            <h2>项目作品</h2>
            <div class="projects-grid" id="projects-container">
                </div>
        </div>
    </section>

    <footer class="footer">
        <p>&copy; 2025 我们的团队。保留所有权利。</p>
    </footer>

    <script src="script.js"></script>

</html>
